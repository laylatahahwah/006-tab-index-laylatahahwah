<html>
    <head>
        <title>Tab Index</title>
    </head>
    <body>
        <form>
           
            <label for="name">Name:</label>
            <input id="name" tabindex="2">
            <br>
            
            
            <label for="age">Age:</label>
            <input id="age" tabindex="1">
            <br>

            
            <label for="city">City:</label>
            <input id="city" tabindex="3" >
            <br>
        </form>
    </body>
</html>
